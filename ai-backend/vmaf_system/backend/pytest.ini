[pytest]
# 测试目录与文件命名约定（详见 docs/NAMING_CONVENTIONS.md）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试默认使用严格模式，避免漏标 @pytest.mark.asyncio 导致测试被静默跳过。
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function

# 让断言失败时输出更完整的差异信息。
addopts =
    -ra
    --strict-markers
    --tb=short

# 自定义标记，便于按子系统筛选执行。
markers =
    contract: 契约层相关测试（base.py）
    scanner: 插件扫描器相关测试（scanner.py）
    parser: 蓝图解析器相关测试（parser.py）
    engine: 图引擎相关测试（engine.py）
    types: 类型兼容判定相关测试
    plugin: 业务插件相关测试（tools/*.py）
    api: HTTP 接口层相关测试（api/routes.py）
  logger: 统一日志相关测试（utils/logger.py）
